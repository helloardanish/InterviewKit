title: InterviewKit
description: >-
  Crack the interview, one pattern at a time. Java solutions for LeetCode,
  design patterns, and real company interview questions.
baseurl: "/InterviewKit"
url: "http://127.0.0.1:4000"

# ── THEME ── use the gem directly, not remote_theme
theme: just-the-docs
color_scheme: light

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Nav
nav_enabled: true
nav_sort: case_insensitive

# Aux links
aux_links:
  "GitHub Repo":
    - "//github.com/your-username/InterviewKit"
aux_links_new_tab: true

# Footer
footer_content: >-
  InterviewKit — MIT License.

# Misc
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle