title: InterviewKit

description: >-
  Crack the interview, one pattern at a time. Java solutions for LeetCode,
  design patterns, and real company interview questions.

baseurl: "/InterviewKit"
url: "https://helloardanish.github.io"

# Theme
theme: just-the-docs
color_scheme: light

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Search
search_enabled: true

search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: case_insensitive

# Auxiliary links
aux_links:
  "GitHub Repo":
    - "https://github.com/helloardanish/InterviewKit"

aux_links_new_tab: true

# Footer
footer_content: >-
  InterviewKit — MIT License.

# Miscellaneous
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .github


sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions